spring:
  datasource:
    url: jdbc:mysql://localhost:3306/attendance_manager?allowPublicKeyRetrieval=true&allowMultiQueries=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:com/rabbiter/am/mapper/*.xml
  type-aliases-package: com.rabbiter.am.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.rabbiter.am.dao: debug
server:
  port: 9331
attendance:
  on-time: '08:30'
  off-time: '17:30'
